name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore Valleysoft.DockerRegistryClient

      - name: Pack
        run: dotnet pack -c Release --no-build Valleysoft.DockerRegistryClient

      - name: Publish Package
        run: |
          package_path="Valleysoft.DockerRegistryClient/bin/Release/Valleysoft.DockerRegistryClient.${GITHUB_REF_NAME#v}.nupkg"
          test -f "$package_path"
          dotnet nuget push "$package_path" -k ${{secrets.NUGET_ORG_API_KEY}} -s https://nuget.org
